<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <title>PRACTICAS JAVASCRIPT</title>
</head>

<body>

    <nav class="navbar bg-primary navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="img/cecy.webp" alt="Logo" width="30" height="30">
                PRACTICAS JAVASCRIPT
            </a>
        </div>
    </nav>

    <div class="container p-4 bg-info mt-5 card">

        <h1 class="text-center">PRACTICA 2</h1>
        <hr>

        <h2 class="text-center">CALCULADORA</h2>
        <br>

        <h5 id="valorNumeroA">NÚMERO 1</h5>
        <input type="range" class="form-control"
            id="numeroA" min="1" max="100" value="1">

        <h5 id="valorNumeroB">NÚMERO 2</h5>
        <input type="range" class="form-control"
            id="numeroB" min="1" max="100" value="1">

        <h5>SELECCIONAR OPERACIÓN</h5>

        <select class="form-control" id="operacion">
            <option value="suma">SUMA</option>
            <option value="resta">RESTA</option>
            <option value="multiplica">MULTIPLICACIÓN</option>
            <option value="divide">DIVISIÓN</option>
        </select>

        <br>

        <h2 class="text-center bg-danger card" id="resultado">
            RESULTADO
        </h2>

    </div>

    <script src="js/02app.js"></script>

</body>
</html>
