<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrediNeto</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/CrediNeto.css">    
</head>
<body>
    <nav class="navbar bg-primary navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="img/cecy.webp" alt="Logo" width="30" height="30">PRACTICAS JAVASCRIPT</a>
        </div>
    </nav>


    <header>
        <img src="img/LogoNeto.png" alt="Logo CrediNeto" width="200">
        <h1>CREDINETO</h1>
    </header>

    <hr>

    <main>
        <h4>Producto:</h4>

        <select id="producto" onchange="calcular()">
            <option value="sal">Sal</option>
            <option value="azucar">Azúcar</option>
            <option value="sopa">Sopa</option>
            <option value="volt">Volt</option>
            <option value="utiles">Útiles</option>
        </select>

        <div id="img"></div>

        <div id="precio">Precio: $0.00 MXN</div>
        <hr>
        <h3>Plazo de crédito</h3>

        <div class="plazos">
            <label>
                <input type="radio" name="plazo" value="6" onchange="calcular()" checked>6 meses (+10%)</label>
            <label>
                <input type="radio" name="plazo" value="12"onchange="calcular()"> 12 meses (+15%)</label>
            <label>
                <input type="radio" name="plazo" value="18"nonchange="calcular()">18 meses (+20%)
            </label>
        </div>

        <div class="cantidad">
            <label for="cantidad">Cantidad de productos:</label>
            <input type="number" id="cantidad" value="1" min="1" max="50" oninput="calcular()">
        </div>
        <section class="resultados">
            <p id="contado">Precio de contado: $0.00 MXN</p>
            <p id="credito">Precio a crédito: $0.00 MXN</p>
            <p id="abono">Abono mensual: $0.00 MXN</p>
        </section>
    </main>

    <script src="js/CrediNeto.js"></script>
</body>
</html>
