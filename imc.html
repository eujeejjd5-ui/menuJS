<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/imc.css">
</head>
<body>
    <table class="table table-bordered border-primary">
        <tr>
            <td>
                <h2>IMC</h2>
                <h3>PESO</h3>
                <input type="range" id="peso" min="1" max="200" value="1" oninput="calcular()"><span id="vp">1</span><br>
                <h3>ALTURA</h3>
                <input type="range" id="altura" min="1" max="2" step="0.01" oninput="calcular()"><span id="va">1.00</span><br>
            </td>
            <td>
                <h3>IMC</h3>
                <h2 id="imc">0</h2>
                <img src="img/delgado.png" alt="" id="img">
            </td>
        </tr>
    </table>
    <br>
    <button class="btn-subtle theme-danger my-3" onclick="reset()"><i class="bi bi-arrow-90deg-left"></i> Reset</button>
    
    <div class="clasificacion" style="width: 450px; max-width: 90%; margin: 20px auto;">
    <div id="imc1" class="rango bajo" style="background-color: #00a2e8;">
        <span>BAJO PESO</span>
        <span>Menor a 18.5</span>
    </div>

    <div id="imc2" class="rango normal" style="background-color: #70bf48; position: relative;">
        <span>PESO NORMAL</span>
        <span>18.5 a 24.9</span>
    </div>

    <div id="imc3" class="rango sobrepeso" style="background-color: #f8d43a; position: relative;">
        <span>SOBREPESO</span>
        <span>25 a 29.9</span>
    </div>

    <div id="imc4" class="rango obesidad1" style="background-color: #f1a122; position: relative;">
        <span>OBESIDAD I</span>
        <span>30 a 34.9</span>
    </div>

    <div id="imc5" class="rango obesidad2" style="background-color: #e3701a; position: relative;">
        <span>OBESIDAD II</span>
        <span>35 a 39.9</span>
    </div>

    <div id="imc6" class="rango obesidad3" style="background-color: #ea2227; position: relative;">
        <span>OBESIDAD III</span>
        <span>40 o más</span>
    </div>
</div>

    <script src="js/imc.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
