<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>MI PRIMERA VEZ CON JAVASCRIPT</title>
</head>
<body>

    <nav class="navbar md:navbar-expand bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="img/cecy.webp" alt="" width="30" height="24" class="d-inline block aling-text-top">PRACTICA 1 JAVASCRIPT
            </a>
        </div>
    </nav>
    <br>
    <div class="container p-4">
        <div class="row">
            <div class="col">
                <button class="btn-subtle theme-danger my-3" onclick="location.href='signos.html'"><i class="bi bi-mouse"></i>Signos Zodiacales</button>
                <button class="btn-text theme-success my-3" onclick="location.href='salarioneto.html'"><i class="bi bi-currency-dollar"></i>Salario Neto</button>
                <button class="btn-subtle theme-primary my-3" onclick="location.href='01practica.html'"><i class="bi bi-calculator"></i>Calculadora</button>
                <button class="btn-link theme-secondary my-3" onclick="location.href='CrediNeto.html'"><i class="bi bi-shop-window"></i></i>Tiendita neto</button>
                <button class="btn-text theme-success my-3" onclick="mensaje1()"><i class="bi bi-geo-alt"></i>Mexico</button>
                <button class="btn-outline theme-warning my-3" onclick="mensaje2()"><i class="bi bi-question-circle"></i>Tamal</button>
                <button class="btn-link theme-primary my-3" onclick="mensaje3()"><i class="bi bi-x-lg"></i></i>Error</button>
                <button class="btn-solid theme-accent my-3" onclick="mensaje4()"><i class="bi bi-image"></i>Imagen</button>
            </div>
            <div class="col">
                <button class="btn-link theme-info my-3" onclick="mensaje5()"><i class="bi bi-journal-x"></i></i>No pasas </button>
                <button class="btn-styled theme-inverse my3" onclick="mensaje6()"><i class="bi bi-info-circle-fill"></i>Info</button>
                <button class="btn-solid theme-secondary my-3" onclick="mensaje7()"><i class="bi bi-question-circle"></i></i>Pregunta</button>
                <button class="btn-subtle theme-primary my-3" onclick="mensaje8()"><i class="bi bi-floppy"></i>Guardar</button>
                <button class="btn-link theme-warning my-3" onclick="mensaje9()"><i class="bi bi-trash"></i>Eliminar</button>
            </div>
        </div>
    </div>

    <script src="bootstrap.bundle.min.js"></script>
    <script src="sweetalert2.all.min.js"></script>
    <script>
        function mensaje(){
            Swal.fire({
                title: "Exito",
                text: "Se ejecuto correctamente",
                icon: "success"
            });
        }
        function mensaje1(){
        Swal.fire("VIVAAAAAAA MEXICOOOOOOOO!!!!!!")};

        function mensaje2(){
            Swal.fire({
                title: "¡Tamales mexicanos!",
                text: "¿De verde, mole o rajas?",
                icon: "question"
            });
        }

        function mensaje3(){
            Swal.fire({
            icon: "error",
            title: "¡Ups!",
            text: "¡Algo salió mal!",
            footer: '<a href="index.html">Volver al inicio</a>'
            });
        }

        function mensaje4(){
            Swal.fire({
            imageUrl: "https://i.redd.it/9r94mzvutv661.jpg",
            imageHeight: 1500,
            imageAlt: "Una imagen alta"
            });
        }

        function mensaje5(){
            Swal.fire({
            title: "Se confirmo q vas a reprobar XDDDDD",
            icon: "success",
            draggable: true
            });
        }

        function mensaje6(){
            Swal.fire({
        title: "<strong>Ejemplo de <u>HTML</u></strong>",
        icon: "info",
        html: `
            Puedes usar <b>texto en negritas</b>,
            <a href="#" autofocus>enlaces</a>,
            y otras etiquetas HTML
        `,
        showCloseButton: true,
        showCancelButton: true,
        focusConfirm: false,
        confirmButtonText: `
            👍 ¡Genial!
        `,
        confirmButtonAriaLabel: "Me gusta, ¡genial!",
        cancelButtonText: `
            👎
        `,
        cancelButtonAriaLabel: "No me gusta"
        });
        }

        function mensaje7(){
            Swal.fire({
            title: "¿CR7 o MESSI?",
            showDenyButton: true,
            showCancelButton: true,
            confirmButtonText: "CR7",
            denyButtonText: "Messi"
            }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire("Buena eleccion");
            } else if (result.isDenied) {
                Swal.fire("Qpedo w cff");
            }
            });
        }

        function mensaje8(){
            Swal.fire({
            position: "top-end",
            icon: "success",
            title: "Tu trabajo se ha guardado",
            showConfirmButton: false,
            timer: 1500
            });
        }

        function mensaje9(){
            Swal.fire({
            title: "¿Estás seguro?",
            text: "¡No podrás revertir esto!",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#3085d6",
            cancelButtonColor: "#d33",
            confirmButtonText: "¡Sí, eliminar!"
            }).then((result) => {
            if (result.isConfirmed) Swal.fire({
                title: "¡Eliminado!",
                text: "Tu archivo ha sido eliminado.",
                icon: "success"
            });
            });
        }

    </script>
</body>
</html>
